<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131b">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مسلسلاتي">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>مسلسلاتي</title>
<style>
:root{color-scheme:dark;--bg:#0e1118;--bar:#141925;--card:#1b2130;--field:#242b3b;--line:#2f374a;--txt:#f4f6fb;--sub:#9aa6bb;--accent:#7de1be;--seen:#2bb58a;--watch:#f0b44c;--danger:#ff8f7a;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);--nav:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;min-height:100dvh;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none}
input{-webkit-user-select:text;user-select:text}
.hidden{display:none!important}

/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab));text-align:center;gap:14px;background:radial-gradient(circle at 50% 0%,#1e2a40 0,var(--bg) 60%);z-index:50}
.screen .logo{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 30px #0008}
.screen h1{margin:6px 0 0;font-size:26px}
.screen p{margin:0;color:var(--sub);line-height:1.6;max-width:340px}
.who{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-top:8px}
.who-btn{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:18px;font-weight:700;text-align:right;min-height:60px}
.who-btn:active{transform:scale(.98);background:var(--field)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;line-height:1;padding-top:.12em;color:#0e1118;flex:none}
.name-row{display:flex;gap:8px;width:100%;max-width:340px}
.field{flex:1;color:#fff;-webkit-text-fill-color:#fff;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;min-height:50px;outline:none}
.field:focus{border-color:var(--accent)}
.field::placeholder{color:#7f8aa0;-webkit-text-fill-color:#7f8aa0}
.primary{background:var(--accent);color:#0b1a14;font-weight:700;border-radius:14px;padding:12px 18px;min-height:50px;font-size:16px}
.primary:active{filter:brightness(.92)}
.muted{color:var(--sub);font-size:13px}

/* ---------- App shell ---------- */
#app{min-height:100dvh;padding-bottom:calc(var(--nav) + var(--sab) + 8px)}
.topbar{position:sticky;top:0;z-index:10;background:#0e1118;padding:calc(10px + var(--sat)) max(16px,var(--sar)) 10px max(16px,var(--sal));border-bottom:1px solid #ffffff0d}
.tb-row{display:flex;align-items:center;gap:10px;max-width:1100px;margin:auto}
.tb-title{font-size:24px;font-weight:700;flex:1;color:#fff;line-height:1.5}
.tb-me{display:flex;align-items:center;gap:7px;background:var(--c,#7de1be);color:#0b1020;border:0;border-radius:999px;padding:7px 14px;font-size:15px;font-weight:700;line-height:1.6;white-space:nowrap}
.tb-me span{line-height:1.6}
.search-wrap{max-width:1100px;margin:10px auto 0;position:relative}
.search-wrap input{width:100%;background:var(--field);border:1px solid transparent;border-radius:12px;padding:10px 40px 10px 14px;font-size:16px;min-height:44px;outline:none}
.search-wrap input:focus{border-color:var(--line)}
.search-wrap svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1100px;margin:10px auto 0;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;min-height:36px}
.chip.on{background:var(--accent);color:#0b1a14;border-color:var(--accent);font-weight:700}
.sync{font-size:11px;color:var(--sub);max-width:1100px;margin:8px auto 0;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--seen)}
.sync.err .dot{background:var(--danger)}.sync.busy .dot{background:var(--watch)}

main{max-width:1100px;margin:auto;padding:14px max(14px,var(--sar)) 0 max(14px,var(--sal))}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.sum b{display:block;font-size:22px;color:var(--accent)}
.sum span{font-size:12px;color:var(--sub)}
.progress{height:6px;background:var(--field);border-radius:99px;overflow:hidden;margin:-4px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--seen),var(--accent));border-radius:99px;transition:width .4s}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-align:right;padding:0;display:flex;flex-direction:column;content-visibility:auto;contain-intrinsic-size:auto 330px}
.card:active{transform:scale(.97)}
.poster{aspect-ratio:2/3;background:linear-gradient(145deg,#26344d,#111827);position:relative;display:grid;place-items:center;color:#abb8ce;font-size:13px;text-align:center;padding:10px;width:100%}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;z-index:1;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;color:#0b1a14;box-shadow:0 2px 8px #0007}
.badge.seen{background:#2fd39a}.badge.watching{background:#f5b942}
.card.seen{border-color:#2bb58a88}.card.watching{border-color:#f0b44c88}
.card .info{padding:9px 10px 10px;display:flex;flex-direction:column;gap:3px}
.card .t{font-size:14px;font-weight:700;direction:ltr;text-align:left;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .m{font-size:11px;color:var(--sub)}
.card .by{line-height:1.8;font-size:11px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:var(--sub);padding:60px 20px;line-height:1.8}
.empty .big{font-size:44px}

/* Activity */
.feed{display:flex;flex-direction:column;gap:8px}
.day{font-size:13px;color:var(--sub);margin:14px 4px 2px;font-weight:700}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 12px;text-align:right;width:100%}
.item .thumb{width:44px;height:64px;flex:none;border-radius:8px;overflow:hidden;background:linear-gradient(145deg,#26344d,#111827);display:grid;place-items:center;font-size:18px}
.item .thumb img{width:100%;height:100%;object-fit:cover}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.item .show{line-height:1.6;font-size:15px;font-weight:700;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .act{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.item .by-pill{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);border-radius:999px;padding:3px 10px;font-weight:700;line-height:1.4;white-space:nowrap}
.item .st{color:var(--sub)}.item .st.seen{color:var(--seen)}.item .st.watching{color:var(--watch)}
.item time{font-size:11px;color:var(--sub);white-space:nowrap;align-self:flex-start;margin-top:4px}

/* Profile */
.section{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.section h3{margin:0;padding:12px 16px 4px;font-size:13px;color:var(--sub);font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:right;font-size:15px;min-height:52px;border-top:1px solid #ffffff0a}
.row:first-of-type{border-top:0}
.row .grow{flex:1}
.row .v{color:var(--sub);font-size:14px}
button.row:active{background:var(--field)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:8px 16px 14px}
.person{background:var(--field);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px}
.person small{display:block;color:var(--sub);font-size:11px}

/* Bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#141925;border-top:1px solid #ffffff12;padding:6px max(6px,var(--sar)) calc(6px + var(--sab)) max(6px,var(--sal));display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:52px;color:var(--sub);font-size:11px;font-weight:600;position:relative;border-radius:12px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab .n{position:absolute;top:2px;left:calc(50% + 6px);background:var(--field);color:var(--txt);font-size:10px;border-radius:99px;padding:1px 6px;min-width:18px;text-align:center}
.tab.on .n{background:var(--accent);color:#0b1a14}

/* Bottom sheet */
.backdrop{position:fixed;inset:0;background:#000a;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bar);border-radius:22px 22px 0 0;padding:8px 18px calc(18px + var(--sab));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:88dvh;overflow-y:auto;overflow-x:hidden;max-width:640px;margin:auto;box-shadow:0 -10px 40px #0009}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:#ffffff30;margin:4px auto 12px}
.sh-head{display:flex;gap:14px;align-items:flex-start}
.sh-poster{width:92px;flex:none;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(145deg,#26344d,#111827);position:relative}
.sh-poster img{width:100%;height:100%;object-fit:cover}
.sh-title{font-size:20px;font-weight:700;direction:ltr;text-align:left;margin:2px 0 6px;line-height:1.3}
.sh-meta{color:var(--sub);font-size:13px}
.sh-last{margin-top:8px;font-size:13px;color:var(--accent)}
.status-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 10px}
.sbtn{--k:#8fa3c7;background:color-mix(in srgb,var(--k) 12%,var(--field));color:var(--k);border:2px solid color-mix(in srgb,var(--k) 30%,transparent);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;font-weight:700;min-height:76px;line-height:1.5;transition:background .15s,transform .1s}
.sbtn[data-s=none]{--k:#9fb0d0}
.sbtn[data-s=watching]{--k:#f5b942}
.sbtn[data-s=seen]{--k:#2fd39a}
.sbtn .ic{font-size:24px;line-height:1}
.sbtn:active{transform:scale(.96)}
.sbtn.on{background:var(--k);color:#0b1020;border-color:var(--k);box-shadow:0 6px 18px color-mix(in srgb,var(--k) 35%,transparent)}
.sh-hist{margin-top:8px}
.sh-hist div{font-size:12px;color:var(--sub);padding:6px 0;border-top:1px solid #ffffff0a}
.link{color:#8bc5ff;text-decoration:none;font-size:13px;display:inline-block;padding:8px 0}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--sab) + 16px);transform:translate(-50%,20px);background:#2a3347;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 6px 20px #0008;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.fab{position:fixed;left:max(18px,var(--sal));bottom:calc(var(--nav) + var(--sab) + 18px);z-index:19;width:58px;height:58px;border-radius:18px;background:var(--accent);color:#0b1a14;font-size:32px;font-weight:700;display:grid;place-items:center;box-shadow:0 8px 24px #0009;line-height:1}
.fab:active{transform:scale(.94)}
.add-h{margin:0 0 12px;font-size:20px}
.wide{width:100%}
.results{display:flex;flex-direction:column;gap:6px;margin:10px 0;max-height:34dvh;overflow:auto}
.res{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid transparent;border-radius:12px;padding:6px;text-align:right}
.res.on{border-color:var(--accent)}
.res img,.res .noimg{width:44px;height:62px;border-radius:6px;object-fit:cover;flex:none;background:var(--field);display:grid;place-items:center}
.res b{display:block;font-size:15px;text-align:left}.res small{color:var(--sub);font-size:12px}
.res span:last-child{flex:1;min-width:0}
.add-form{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.add-prev{display:flex;gap:12px;align-items:flex-start}
.add-prev .sh-poster{width:80px}
select.field{-webkit-appearance:none;appearance:none;flex:1;min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.pick{min-width:0;display:flex;flex-direction:column;gap:4px;background:var(--card);border-radius:10px;padding:4px;text-align:center}
.pick img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:7px;background:var(--field)}
.pick small{font-size:10px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick:active{outline:2px solid var(--accent)}
button.sh-poster{padding:0;border:0;display:grid;place-items:center;color:var(--sub);font-size:11px}
.noposter{line-height:1.6}
.sheet.full{top:0;bottom:0;max-height:none;height:100%;border-radius:0;max-width:none;padding:0;display:flex;flex-direction:column;overflow:hidden}
.sheet.full .grab{display:none}
.full-head{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + var(--sat)) 12px 6px;flex:none}
.full-head h2{margin:0;font-size:18px;color:#fff}
.full-head .x{width:40px;height:40px;border-radius:50%;background:var(--field);font-size:18px;color:#fff}
.full-search{padding:6px 16px 10px;flex:none;border-bottom:1px solid #ffffff10}
.full-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(24px + var(--sab))}
.full-body .results{max-height:none;margin:8px 0}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rt b{font-size:15px;text-align:left;line-height:1.4}
.rt small{color:var(--sub);font-size:12px;text-align:left}
.rt em{font-style:normal;font-size:11px;color:var(--accent);text-align:right}.rt em.nk{color:var(--sub)}
.manual{display:block;margin:6px auto 0;font-size:14px}
.confirm{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.cposter{width:110px;flex:none;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,#26344d,#111827);display:grid;place-items:center;font-size:30px}
.cposter img{width:100%;height:100%;object-fit:cover}
.cfields{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.cfields label,label.blk,div.blk{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--sub);font-weight:700}
label.blk{margin-bottom:10px}
.sumbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:4px 0 8px}
.sum-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:#fff}
.sum-h .link{padding:0}
.sum-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sum-chips span{background:var(--field);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--txt);line-height:1.6}
.sum-txt{margin:0;font-size:14px;line-height:1.8;color:#dfe5f0;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;-webkit-user-select:text;user-select:text}
.sum-txt.open{display:block;-webkit-line-clamp:unset}
.sum-txt.en{direction:ltr;text-align:left}
.del{width:100%;margin-top:10px;background:#ff8f7a1a;color:var(--danger);border-radius:12px;padding:12px;font-weight:700;min-height:48px}
@media (min-width:700px){.fab{bottom:110px;left:max(24px,calc(50% - 300px))}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.summary{max-width:520px}nav.tabs{max-width:560px;margin:auto;left:0;right:0;bottom:12px;border-radius:20px;border:1px solid #ffffff14;padding-bottom:6px}#app{padding-bottom:110px}.toast{bottom:100px}}
@media (hover:hover){.card:hover{border-color:#ffffff40}.tab:hover{color:var(--txt)}}
</style>
</head>
<body>

<!-- No access -->
<section id="noaccess" class="screen hidden">
  <img class="logo" src="icon-192.png" alt="">
  <h1>🔒 رابط خاص</h1>
  <p>هذا التطبيق خاص. ألصق الرابط الخاص اللي وصلك هنا مرة وحدة بس.</p>
  <form class="name-row" id="keyForm" style="flex-direction:column">
    <input class="field" id="keyInput" placeholder="ألصق الرابط هنا" autocomplete="off" dir="ltr">
    <button class="primary" type="submit">فتح</button>
  </form>
  <div class="muted" id="keyErr"></div>
</section>

<!-- Login -->
<section id="login" class="screen hidden">
  <img class="logo" src="icon-192.png" alt="">
  <h1>مسلسلاتي 🎬</h1>
  <p>اختر اسمك عشان نعرف مين علّم على كل مسلسل</p>
  <div class="who" id="whoList"></div>
  <div class="muted" style="margin-top:6px">أو اكتب اسمك</div>
  <form class="name-row" id="nameForm">
    <input class="field" id="nameInput" maxlength="30" placeholder="اسمك" autocomplete="off" enterkeyhint="done">
    <button class="primary" type="submit">دخول</button>
  </form>
</section>

<!-- App -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="tb-row">
      <div class="tb-title" id="title">المسلسلات</div>
      <button class="tb-me" id="meBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span id="meName"></span></button>
    </div>
    <div id="browseTools">
      <div class="search-wrap">
        <input id="search" type="search" enterkeyhint="search" placeholder="ابحث عن مسلسل…" autocomplete="off" autocorrect="off" spellcheck="false" name="list-filter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="sync" id="sync"><span class="dot"></span><span id="syncTxt">جاري التحميل…</span></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs hidden" id="tabs">
  <button class="tab on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>الرئيسية<span class="n" id="n-home"></span></button>
  <button class="tab" data-tab="watching"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m10 8.5 5 3.5-5 3.5z" fill="currentColor"/></svg>أشاهده<span class="n" id="n-watching"></span></button>
  <button class="tab" data-tab="seen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>شاهدته<span class="n" id="n-seen"></span></button>
  <button class="tab" data-tab="activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>النشاط</button>

function ago(t){let d=(t-Date.now())/1000,a=Math.abs(d);if(a<45)return 'الآن';if(a<3600)return rtf.format(Math.round(d/60),'minute');if(a<86400)return rtf.format(Math.round(d/3600),'hour');if(a<86400*30)return rtf.format(Math.round(d/86400),'day');return new Date(t).toLocaleDateString('ar')}

function haptic(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}

/* ---------- API ---------- */
async function api(method,body,path){
  let res=await fetch(path||'/api/state',{method,cache:'no-store',headers:{'content-type':'application/json','x-key':KEY,'x-user':encodeURIComponent(ME||'')},body:body?JSON.stringify(body):undefined});
  if(res.status===401){showScreen('noaccess');throw Error('key')}
  if(res.status===409)throw Error('exists');
  if(!res.ok)throw Error('http');
  return res.json();
}
function syncState(cls,txt){let el=$('sync');el.className='sync '+(cls||'');$('syncTxt').textContent=txt}
function apply(d){let before=JSON.stringify([data.custom||[],data.hidden||[]]);data={states:d.states||{},log:d.log||[],users:d.users||[],custom:d.custom||[],posters:d.posters||{},hidden:d.hidden||[]};ls.set(LS.cache,data);rebuild();if(JSON.stringify([data.custom,data.hidden])!==before)renderChips()}
async function pull(first){
  if(pending)return;
  try{let d=await api('GET');if(pending)return;apply(d);if(first)boot();else{render();refreshSheet()}syncState('','متزامن · '+new Date().toLocaleTimeString('ar',{hour:'numeric',minute:'2-digit'}))}
  catch(e){if(e.message!=='key'){if(first&&KEY)boot();syncState('err','غير متصل — يعرض آخر نسخة')}}
}
async function setState(id,s){
  if(st(id)===s)return;
  haptic();
  data.states[id]={s,by:ME,at:Date.now()};
  data.log.unshift({id,s,by:ME,at:Date.now()});
  ls.set(LS.cache,data);render();refreshSheet();
  toast(s==='none'?'تمت إزالة العلامة':(s==='seen'?'✓ ':'▶ ')+LABEL[s]+' — '+byId[id].name);
  pending++;syncState('busy','جاري الحفظ…');
  try{let d=await api('POST',{id,state:s,by:ME});pending--;if(!pending){apply(d);render();refreshSheet()}syncState('','تم الحفظ')}
  catch(e){pending--;if(e.message!=='key')syncState('err','لم يتم الحفظ — تحقق من الاتصال')}
}

/* ---------- Screens ---------- */
function showScreen(name){
  ['noaccess','login'].forEach(s=>$(s).classList.toggle('hidden',s!==name));
  const inApp=name==='app';$('app').classList.toggle('hidden',!inApp);$('tabs').classList.toggle('hidden',!inApp);
}
function showLogin(){
  let names=[...new Set([...(data.users||[]).map(u=>u.name),...data.log.map(l=>l.by)])].filter(Boolean);
  $('whoList').innerHTML=names.length?names.map(n=>`<button class="who-btn" data-name="${esc(n)}">${avatar(n)}<span>${esc(n)}</span></button>`).join(''):'';
  $('whoList').querySelectorAll('.who-btn').forEach(b=>b.onclick=()=>login(b.dataset.name));
  showScreen('login');
}
function login(n){n=(n||'').trim().replace(/\s+/g,' ').slice(0,30);if(!n)return;ME=n;ls.set(LS.me,n);boot();pull()}
$('keyForm').onsubmit=async e=>{e.preventDefault();let v=$('keyInput').value.trim(),m=v.match(/k=([^&\s]+)/);let k=m?decodeURIComponent(m[1]):v;if(!k)return;
  KEY=k;try{let r=await fetch('/api/state',{headers:{'x-key':k},cache:'no-store'});if(r.status===401){$('keyErr').textContent='الرابط غير صحيح';return}}catch(err){}
  ls.set(LS.key,k);history.replaceState(null,'',location.pathname+'#k='+encodeURIComponent(k));location.reload()};
$('nameForm').onsubmit=e=>{e.preventDefault();login($('nameInput').value)};

function boot(){
  if(!ME){showLogin();return}
  $('meName').textContent=ME;$('meBtn').style.setProperty('--c',colorFor(ME));
  showScreen('app');render();
}

/* ---------- Rendering ---------- */
function renderChips(){
  let genres=[...new Set(shows.map(s=>s.genre))];
  let years=[...new Set(shows.map(s=>s.year).filter(Boolean))].sort((a,b)=>b-a);
  let opts=[['all','الكل'],['left','لم أشاهده'],...(shows.some(s=>s.custom)?[['added','أضفناه']]:[]),...genres.map(g=>['g:'+g,g]),...years.map(y=>['y:'+y,String(y)])];
  $('chips').innerHTML=opts.map(([v,t])=>`<button class="chip ${genre===v?'on':''}" data-v="${esc(v)}">${esc(t)}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{genre=c.dataset.v;renderChips();render()});
}
function filtered(list){
  let q=query.trim().toLowerCase();
  return list.filter(s=>(!q||s.name.toLowerCase().includes(q)||s.genre.includes(q)||String(s.year)===q)&&
    (genre==='all'||(genre==='left'&&st(s.id)==='none')||(genre==='added'&&s.custom)||(genre.startsWith('g:')&&s.genre===genre.slice(2))||(genre.startsWith('y:')&&String(s.year)===genre.slice(2))));
}
function cardHTML(s){
  let x=data.states[s.id],state=st(s.id);
  let badge=state==='none'?'':`<span class="badge ${state}">${state==='seen'?'✓ شاهدته':'▶ أشاهده'}</span>`;
  let pu=posterOf(s.id),img=pu?`<img src="${esc(pu)}" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:'';
  let by=x&&x.by&&state!=='none'?`<div class="by">${esc(x.by)} · ${ago(x.at)}</div>`:'';
  return `<button class="card ${state==='none'?'':state}" data-id="${s.id}"><div class="poster">${badge}<span>🎬<br>${esc(s.name)}</span>${img}</div><div class="info"><div class="t">${esc(s.name)}</div><div class="m">${s.year?s.year+' · ':''}${esc(s.genre)}${s.custom?' · ➕':''}</div>${by}</div></button>`;
}
function bindCards(root){root.querySelectorAll('.card').forEach(c=>c.onclick=()=>openSheet(+c.dataset.id))}
function counts(){let c={seen:0,watching:0};shows.forEach(s=>{let v=st(s.id);if(c[v]!=null)c[v]++});return c}
function render(){
  let c=counts();
  $('n-home').textContent=shows.length-c.seen||'';$('n-watching').textContent=c.watching||'';$('n-seen').textContent=c.seen||'';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  let browse=['home','watching','seen'].includes(tab);
  $('browseTools').classList.toggle('hidden',!browse);
  $('title').textContent={home:'الرئيسية',watching:'أشاهده الآن',seen:'شاهدته',activity:'النشاط',me:'حسابي'}[tab];
  let v=$('view');
  if(tab==='home'){
    let list=filtered(query.trim()?shows:shows.filter(s=>st(s.id)!=='seen')),pct=Math.round(c.seen/shows.length*100);
    v.innerHTML=`<div class="summary"><div class="sum"><b>${c.seen}</b><span>شاهدناه</span></div><div class="sum"><b>${c.watching}</b><span>نشاهده</span></div><div class="sum"><b>${shows.length-c.seen-c.watching}</b><span>المتبقي</span></div></div><div class="progress"><i style="width:${pct}%"></i></div>`+
      (list.length?`<div class="grid">${list.map(cardHTML).join('')}</div>`:`<div class="empty"><div class="big">🔍</div>ما فيه نتائج${query?`<br><button class="primary" style="margin-top:12px" id="addFromSearch">➕ أضف "${esc(query)}"</button>`:''}</div>`);
  }else if(tab==='watching'||tab==='seen'){
    let list=filtered(shows.filter(s=>st(s.id)===tab)).sort((a,b)=>(data.states[b.id].at||0)-(data.states[a.id].at||0));
    v.innerHTML=list.length?`<div class="grid">${list.map(cardHTML).join('')}</div>`:`<div class="empty"><div class="big">${tab==='seen'?'🏁':'🍿'}</div>${tab==='seen'?'ما خلصتوا أي مسلسل للحين':'ما تشاهدون شي حاليًا'}<br><span class="muted">اضغط على أي مسلسل من "الكل" وغيّر حالته</span></div>`;
  }else if(tab==='activity'){
    if(!data.log.length){v.innerHTML=`<div class="empty"><div class="big">📝</div>ما فيه نشاط للحين<br><span class="muted">أي تعديل منك أو من شريكك بيظهر هنا</span></div>`}
    else{let out='',last='';for(const l of data.log){let s=byId[l.id];if(!s)continue;let d=new Date(l.at).toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'});if(d!==last){out+=`<div class="day">${d}</div>`;last=d}
      let pu=posterOf(l.id),act={seen:'✓ أنهى المشاهدة',watching:'▶ بدأ المشاهدة',none:'◯ أزال العلامة',added:'➕ أضاف المسلسل'}[l.s]||'';
      out+=`<button class="item" data-id="${l.id}"><span class="thumb">${pu?`<img src="${esc(pu)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:'🎬'}</span><div class="txt"><div class="show" dir="ltr">${esc(s.name)}</div><div class="act"><span class="by-pill" style="--c:${colorFor(l.by)}">${esc(l.by)}</span><span class="st ${l.s}">${act}</span></div></div><time>${ago(l.at)}</time></button>`}
      v.innerHTML=`<div class="feed">${out}</div>`;v.querySelectorAll('.item').forEach(i=>i.onclick=()=>openSheet(+i.dataset.id))}

async function posterSearch(q,id){

    let kr=arr.find(x=>x.show.language==='Korean');
    if(kr){let ss=await fetch(`https://api.tvmaze.com/shows/${kr.show.id}/seasons`).then(r=>r.json());ss.forEach(se=>se.image&&add(se.image.medium,kr.show.name+' — الموسم '+se.number))}}catch(e){}
  try{let j=await fetch('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=4&prop=pageimages&pilicense=any&piprop=thumbnail&pithumbsize=400&gsrsearch='+encodeURIComponent(q+' South Korean television series')).then(r=>r.json());
    Object.values((j.query||{}).pages||{}).sort((a,b)=>a.index-b.index).forEach(p=>p.thumbnail&&add(p.thumbnail.source.split('?')[0],'ويكيبيديا: '+p.title))}catch(e){}
  if(!$('pRes')||$('pQ').value.trim()!==q)return;
  $('pHint').textContent=out.length?'اضغط على البوستر الصحيح:':'ما لقيت صور — جرّب اسم ثاني أو ألصق رابط';
  $('pRes').innerHTML=out.map((o,i)=>`<button class="pick" data-i="${i}"><img src="${esc(o.u)}" alt="" loading="lazy" referrerpolicy="no-referrer"><small dir="auto">${esc(o.label)}</small></button>`).join('');
  $('pRes').querySelectorAll('.pick').forEach(b=>b.onclick=()=>savePoster(id,out[+b.dataset.i].u));
}
async function savePoster(id,url){
  if(!/^https:\/\//.test(url)){toast('الرابط لازم يبدأ بـ https://');return}
  haptic();try{let d=await api('POST',{id,url,by:ME},'/api/posters');apply(d);render();toast('✓ تم تغيير البوستر');openSheet(id)}catch(e){toast('تعذّر الحفظ — تحقق من الاتصال')}
}

/* ---------- Auto-update ---------- */
async function checkUpdate(){try{let t=await fetch('/?u='+Date.now(),{cache:'no-store'}).then(r=>r.text());let m=t.match(/const BUILD='(\d+)'/);if(m&&m[1]!==BUILD)location.reload()}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});

/* ---------- Start ---------- */
renderChips();
if(!KEY){showScreen('noaccess')}
else{if(ME)boot();checkUpdate();pull(true).then(resolveMissing);
  setInterval(()=>{if(!document.hidden)pull()},15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});}
</script>
